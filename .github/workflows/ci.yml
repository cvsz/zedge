name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { node: [20, 22] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run openapi:check
  affiliate-link-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
        working-directory: affiliate-os/services/link-service
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/zedge
      - run: helm template t deploy/helm/zedge --set ingress.enabled=true > /dev/null
      - name: Refuses more than one replica
        run: |
          if helm template t deploy/helm/zedge --set replicaCount=2 > /dev/null 2>&1; then echo 'should have failed'; exit 1; fi
  browser:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., push: false, load: true, tags: 'zedge:ci' }
      - name: Container starts and answers
        run: |
          docker run -d --name ec -p 8787:8787 -e HOST=0.0.0.0 -e CLOUDFLARE_API_TOKEN=dummy -e ZEDGE_ADMIN_PASSWORD=ci-password-123456 -e COOKIE_SECURE=0 zedge:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8787/api/session && exit 0; sleep 1; done
          docker logs ec; exit 1
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm audit --omit=dev --audit-level=high
  affiliate-os:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: affiliate-os } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test                 # in-memory Postgres (PGlite)
      - run: npm run test:pg          # same suites on a real Postgres
      - run: npm run e2e:pg           # migrate CLI + studio entry point on a real Postgres
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/sbom.mjs package-lock.json --out sbom-console.json
      - run: node scripts/sbom.mjs affiliate-os/package-lock.json --out sbom-affiliate-os.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: 'sbom-*.json' }
