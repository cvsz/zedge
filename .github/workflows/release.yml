# UNTESTED: written without access to a registry or GitHub runner. Run it once on a throwaway tag and read the output before relying on it.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write          # keyless signing with the workflow's OIDC identity
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: build
        uses: docker/build-push-action@v6
        with: { context: ., push: true, tags: 'ghcr.io/${{ github.repository }}:${{ github.ref_name }}' }
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image by digest
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
      - name: Verify the signature (identity must be this workflow)
        run: |
          cosign verify "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
