# Scrape config example. Put the same value as METRICS_TOKEN in the file below, readable only by Prometheus.
scrape_configs:
  - job_name: zedge
    metrics_path: /metrics
    scrape_interval: 30s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/zedge.token
    static_configs:
      - targets: ["zedge.internal:8787"]
rule_files:
  - zedge-alerts.yml
